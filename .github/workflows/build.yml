name: Build AUREON

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: AUREON-${{ matrix.artifact }}
          path: |
            build/**/AUREON*.vst3
            build/**/AUREON*.app
            build/**/AUREON*.exe
          if-no-files-found: warn
