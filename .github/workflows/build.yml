name: Build AUREON

on:
  push:
    branches: [ main, feature/soundfont-piano-engine ]
  pull_request:
    branches: [ main, fix/reverb-dsp-processing ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AUREON-${{ runner.os }}-VST3
          path: build/AUREON_artefacts/Release/VST3/AUREON.vst3
          if-no-files-found: error
          retention-days: 14
